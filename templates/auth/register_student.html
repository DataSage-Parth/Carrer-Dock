{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h4 class="fw-bold mb-3">Student Signup</h4>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <input type="text" name="branch" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CGPA <span class="text-muted small">(out of 10)</span></label>
                        <input type="number" name="cgpa" class="form-control" step="0.01" min="0" max="10" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Resume Link <span class="text-muted small">(optional)</span></label>
                        <input type="url" name="resume_link" class="form-control" placeholder="https://drive.google.com/your-resume.pdf">
                    </div>
                    <button class="btn btn-dark w-100 btn-lg">Register</button>
                </form>

                <hr class="my-4">
                <div class="small text-muted">
                    Already registered? <a href="{{ url_for('auth.login') }}">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
