{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="hero-section">
    <div class="container h-100">
        <div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 70px);">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 rounded-4 p-4">               
                    <h4 class="fw-bold mb-3 text-center">Sign In</h4>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button class="btn btn-dark w-100 btn-lg">Login</button>
                    </form>
                    <hr class="my-4">
                    <div class="small text-muted text-center">
                        New student? <a href="{{ url_for('auth.register_student') }}">Register</a><br>
                        New company? <a href="{{ url_for('auth.register_company') }}">Register</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
