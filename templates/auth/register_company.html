{% extends "base.html" %}
{% block title %}Company Registration{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h4 class="fw-bold mb-3">Company Signup</h4>
                  <div class="small text-muted" style="margin-top: 0px; margin-bottom: 12px; background:#f1f5f9; padding:8px 10px; border-radius:6px;">
                       <b style="color:#111;">Note:</b> Company accounts require admin approval before login.
                  </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">HR Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" name="company_name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">HR Contact</label>
                        <input type="text" name="hr_contact" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Website <span class="text-muted small">(optional)</span></label>
                        <input type="url" name="website" class="form-control" placeholder="https://yourcompany.com">
                    </div>

                    <button class="btn btn-dark w-100 btn-lg">Register</button>
                </form>

                <hr class="my-4">
                <div class="small text-muted">
                    Already registered? <a href="{{ url_for('auth.login') }}">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
