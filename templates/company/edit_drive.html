{% extends "base.html" %}
{% block title %}Edit Drive{% endblock %}

{% block content %}
<div class="container py-4">
    <h3 class="fw-bold mb-4">Edit Drive</h3>

    <div class="card p-4 rounded-4 shadow-sm border-0">
        <form method="POST">

            <div class="mb-3">
                <label class="form-label fw-bold">Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       value="{{ drive.title }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4"
                          required>{{ drive.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Eligibility</label>
                <input type="text"
                       name="eligibility"
                       class="form-control"
                       value="{{ drive.eligibility }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Deadline</label>
                <input type="date"
                       name="deadline"
                       class="form-control"
                       value="{{ drive.deadline }}"
                       required>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-dark">Update Drive</button>
                <a href="{{ url_for('company.drives') }}"
                   class="btn btn-outline-secondary">
                   Cancel
                </a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
